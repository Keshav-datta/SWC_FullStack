<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Listing</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>🍽️ Food Delivery</h1>

        <input
            type="text"
            id="searchInput"
            placeholder="Search Restaurants..."
        >

        <div class="filters">
            <button onclick="filterRestaurants('All')">All</button>
            <button onclick="filterRestaurants('Fast Food')">Fast Food</button>
            <button onclick="filterRestaurants('Indian')">Indian</button>
            <button onclick="filterRestaurants('Chinese')">Chinese</button>
        </div>
    </header>

    <div id="restaurantContainer" class="restaurant-grid"></div>

    <script src="js/script.js"></script>

</body>
</html>
